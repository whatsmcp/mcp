<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="WhatsMCP architecture: your AI client connects over OAuth or an API key to one HTTPS MCP endpoint (api.whatsmcp.com/mcp), which drives your WhatsApp number, bridges calls to SIP, and runs hosted AI agents.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22C55E"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B86"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" rx="16" fill="#0A1120"/>
  <rect x="1" y="1" width="898" height="358" rx="15" fill="none" stroke="#223150" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="32" y="33" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#7F8EA6">HOW WHATSMCP CONNECTS</text>

    <!-- main flow (green) -->
    <line x1="241" y1="110" x2="342" y2="110" stroke="#22C55E" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="596" y1="110" x2="697" y2="110" stroke="#22C55E" stroke-width="2.5" marker-end="url(#ah)"/>
    <!-- branches (muted) -->
    <path d="M450,161 C450,205 375,206 375,247" fill="none" stroke="#5B6B86" stroke-width="2" marker-end="url(#ahg)"/>
    <path d="M490,161 C490,205 700,206 700,247" fill="none" stroke="#5B6B86" stroke-width="2" marker-end="url(#ahg)"/>

    <text x="291" y="100" text-anchor="middle" font-size="11" fill="#93A0B7">OAuth &#183; API key</text>
    <text x="646" y="100" text-anchor="middle" font-size="11" fill="#93A0B7">linked &#183; Business</text>

    <!-- Your AI client -->
    <rect x="30" y="68" width="211" height="84" rx="12" fill="#16213C" stroke="#2B3E62" stroke-width="1"/>
    <text x="135" y="103" text-anchor="middle" font-size="15.5" font-weight="700" fill="#E8EEF6">Your AI client</text>
    <text x="135" y="125" text-anchor="middle" font-size="11" fill="#93A0B7">Claude &#183; Cursor &#183; ChatGPT &#183; Codex</text>

    <!-- Endpoint (brand green hero) -->
    <rect x="342" y="60" width="254" height="100" rx="12" fill="#22C55E"/>
    <text x="469" y="95" text-anchor="middle" font-size="15.5" font-weight="700" fill="#052E16">api.whatsmcp.com/mcp</text>
    <text x="469" y="117" text-anchor="middle" font-size="11" fill="#064E26">one HTTPS endpoint &#183; Streamable HTTP</text>
    <text x="469" y="134" text-anchor="middle" font-size="11" fill="#064E26">48 tools &#183; OAuth 2.1</text>

    <!-- WhatsApp -->
    <rect x="697" y="68" width="173" height="84" rx="12" fill="#16213C" stroke="#2B3E62" stroke-width="1"/>
    <text x="783" y="103" text-anchor="middle" font-size="15.5" font-weight="700" fill="#E8EEF6">WhatsApp</text>
    <text x="783" y="125" text-anchor="middle" font-size="11" fill="#93A0B7">your linked number</text>

    <!-- SIP -->
    <rect x="250" y="247" width="250" height="82" rx="12" fill="#16213C" stroke="#2B3E62" stroke-width="1"/>
    <text x="375" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#E8EEF6">SIP bridge</text>
    <text x="375" y="303" text-anchor="middle" font-size="11" fill="#93A0B7">WhatsApp calls &#8596; SIP phone / PBX</text>

    <!-- AI Agents -->
    <rect x="540" y="247" width="320" height="82" rx="12" fill="#16213C" stroke="#2B3E62" stroke-width="1"/>
    <text x="700" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#E8EEF6">Autonomous AI Agents</text>
    <text x="700" y="303" text-anchor="middle" font-size="11" fill="#93A0B7">24/7 &#183; chat + ElevenLabs voice</text>

  </g>
</svg>
